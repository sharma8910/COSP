<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Child Safety Setup</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="card">
      <div class="badge">Child Safety</div>
      <h1>Connect this browser</h1>
      <label>API URL<input id="apiUrl" placeholder="http://localhost:4000"></label>
      <label>Device token<input id="deviceToken" type="password" autocomplete="off"></label>
      <button id="save">Save settings</button>
      <p id="status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
